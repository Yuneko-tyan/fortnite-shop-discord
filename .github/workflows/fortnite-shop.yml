
name: Fortnite Shop Notifier

on:
  schedule:
    - cron: "5,15,30,45 0 * * *"
    - cron: "15 1 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fortnite-shop-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check Fortnite shop
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify.py

      - name: Check Fortnite shop
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ITEMSHOP_API_KEY: ${{ secrets.ITEMSHOP_API_KEY }}
        run: python notify.py

     
      - name: Save shop state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          git diff --cached --quiet || git commit -m "Update Fortnite shop state"

          git push

